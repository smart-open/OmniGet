# T0-2 收口：三平台打包 CI
#
# 产物命名（CI 内重命名后上传，版本号取自 package.json）：
#   windows: OmniGet_{version}_x64-setup.exe / OmniGet_{version}_x64_portable.zip / OmniGet_{version}_x64_zh-CN.msi
#   macos:   OmniGet_{version}_x64.dmg / OmniGet_{version}_aarch64.dmg（universal 无法捆绑平台化 sidecar，不产出）
#   linux:   OmniGet_{version}_x64.AppImage / OmniGet_{version}_x64.deb
#
# 注意：mac/linux 目标缺少对应 sidecar（engines/darwin-*、engines/linux-*）时
# 仅产出告警——包可构建，但引擎缺失（应用会降级提示），发布前需在各平台准备 sidecar。
#
# 跨平台审查修复（P1）：mac runner 为 arm64——分两段出包，x64 dmg 单独交叉收集
# darwin-x64 sidecar（此前 x64 dmg 捆绑 arm64 二进制，Intel Mac 引擎全部不可执行）。

name: build

# 第七轮审查 P3：最小权限声明 + npm ci（lock 存在，产物依赖树可重现）
permissions:
  contents: read

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build renderer & main
        run: npm run build

      # sidecar 收集（遗留清单 #1）：官方/高星发布源下载 aria2c / yt-dlp / ffmpeg 到引擎目录
      # 本地仓库若已提交引擎二进制则脚本按"已存在跳过"处理
      - name: Collect sidecars
        run: node scripts/fetch-sidecars.mjs

      # sidecar 就位门禁（发布口径）：缺失即 fail，杜绝"零引擎安装包"静默出包
      # （跨平台审查 P0-1：yt-dlp 落盘名统一为运行时口径 yt-dlp / yt-dlp.exe）
      # 第六轮审查：补架构断言——此前 win/linux 只查文件存在，配合 need() 的
      # 「已存在跳过」会让错误架构/损坏二进制静默进包（mac 侧已有 file 断言）
      - name: Verify sidecars
        if: matrix.platform != 'mac'
        shell: bash
        run: |
          plat="${{ matrix.platform }}"
          case "$plat" in
            win) dirs="resources/engines/win32-x64"; bins="aria2c.exe yt-dlp.exe ffmpeg.exe ffprobe.exe" ;;
            linux) dirs="resources/engines/linux-x64"; bins="aria2c yt-dlp ffmpeg ffprobe" ;;
          esac
          missing=0
          for bin in $bins; do
            if [ ! -f "$dirs/$bin" ]; then
              echo "::error::sidecar 缺失：$dirs/$bin"
              missing=1
              continue
            fi
            if [ "$plat" = "linux" ]; then
              info=$(file "$dirs/$bin")
              echo "$info"
              echo "$info" | grep -qi 'x86-64' || { echo "::error::$bin 非 x86_64 构建"; missing=1; }
            else
              # Git Bash 无 file——用 PowerShell 读 PE 头 machine 字段（0x8664 = x64）。
              # 回归审查修正：-Command 的后续 token 不绑定 $args（恒 null 必失败）——
              # 路径经 bash 展开后直接内插进命令文本（引擎目录无空格/$ 字符）
              if ! powershell -NoProfile -Command "\$b=[IO.File]::ReadAllBytes('$dirs/$bin'); \$o=[BitConverter]::ToInt32(\$b,0x3C); \$m=[BitConverter]::ToUInt16(\$b,\$o+4); if(\$m -ne 0x8664){exit 1}"; then
                echo "::error::$bin 非 x64 PE（machine 字段 != 0x8664）"
                missing=1
              fi
            fi
          done
          exit $missing

      - name: Package (electron-builder)
        if: matrix.platform != 'mac'
        # 自动更新通道（第七轮恢复 win）：--publish never 本身不产出 latest.yml，
        # 但下方「Rename artifacts (windows)」已补生成 latest.yml 并保留重命名的
        # blockmap——win 发布资产挂上即恢复 electron-updater 整包/差量自动更新。
        # mac/linux 仍走应用内手动检查（GitHub API 比对 + 引擎热更）通道
        #
        # 一期（backlog §一 #2）：CI runner 具备 winCodeSign 缓存解压的特权条件，
        # 用 CLI 覆盖开启 signAndEditExecutable（恢复 exe 图标/版本信息印刻；
        # 本地 electron-builder.yml 维持 false，无特权机器构建不再炸）。
        # EV 证书（可选）：向仓库 secrets 配置 WINDOWS_CSC_LINK（PFX base64 或 URL）/
        # WINDOWS_CSC_KEY_PASSWORD 后自动启用 signtool 签名；未配置（空值）时
        # electron-builder 跳过签名仅做资源印刻，构建不受影响
        run: |
          case "${{ matrix.platform }}" in
            win) npx electron-builder --win --publish never -c.win.signAndEditExecutable=true ;;
            linux) npx electron-builder --linux --publish never ;;
          esac
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

      # ── mac：arm64 runner 分架构两段出包（x64 dmg 不能捆绑 arm64 sidecar）──
      # 架构断言（file 命令）：aria2 的 macos-darwin 资产架构未证实（单一资产覆盖两段
      # 收集），arm64 侧接受 arm64 或 x86_64（universal / Rosetta 2 可执行），x64 侧
      # 必须 x86_64——若 q3aql 资产不支持，CI 第一时间显式失败而非出带坏引擎的包
      - name: Verify sidecars (darwin-arm64)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          missing=0
          for bin in aria2c yt-dlp ffmpeg ffprobe; do
            f="resources/engines/darwin-arm64/$bin"
            if [ ! -f "$f" ]; then
              echo "::error::sidecar 缺失：$f"
              missing=1
              continue
            fi
            info=$(file "$f")
            echo "$info"
            case "$bin" in
              aria2c|yt-dlp)
                echo "$info" | grep -qiE 'arm64|x86_64' || { echo "::error::$bin 不含可执行架构（期望 arm64/universal）"; missing=1; } ;;
              *)
                echo "$info" | grep -qi 'arm64' || { echo "::error::$bin 非 arm64 构建"; missing=1; } ;;
            esac
          done
          exit $missing

      - name: Package mac arm64 (electron-builder)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --arm64 --publish never

      - name: Collect sidecars (darwin-x64)
        if: matrix.platform == 'mac'
        run: node scripts/fetch-sidecars.mjs --target darwin-x64

      - name: Verify sidecars (darwin-x64)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          missing=0
          for bin in aria2c yt-dlp ffmpeg ffprobe; do
            f="resources/engines/darwin-x64/$bin"
            if [ ! -f "$f" ]; then
              echo "::error::sidecar 缺失：$f"
              missing=1
              continue
            fi
            info=$(file "$f")
            echo "$info"
            echo "$info" | grep -qi 'x86_64' || { echo "::error::$bin 不含 x86_64 架构（Intel Mac 无法执行）"; missing=1; }
          done
          exit $missing

      - name: Package mac x64 (electron-builder)
        if: matrix.platform == 'mac'
        run: npx electron-builder --mac --x64 --publish never

      # ── 产物重命名（统一命名口径）────────────────────────────────────
      # 第七轮：保留 blockmap 并生成 latest.yml——原 --publish never 丢弃 blockmap
      # 且无 latest.yml，electron-updater 自动更新完全断链。发布资产挂上
      # latest.yml + 重命名后的 blockmap 即可恢复整包/差量自动更新
      - name: Rename artifacts (windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $v = (Get-Content package.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          Set-Location release
          $setup = "OmniGet_${v}_x64-setup.exe"
          Get-ChildItem *.exe -File |
            Where-Object { $_.Name -ne $setup } |
            Rename-Item -NewName $setup
          # blockmap 随 exe 同步重命名（electron-updater 按下载 URL + .blockmap 后缀寻址）
          $blockmap = Get-ChildItem *.exe.blockmap -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($blockmap) { Rename-Item $blockmap.FullName -NewName "$setup.blockmap" }
          Get-ChildItem *.zip -File | Rename-Item -NewName "OmniGet_${v}_x64_portable.zip"
          Get-ChildItem *.msi -File | Rename-Item -NewName "OmniGet_${v}_x64_zh-CN.msi"
          # 生成 latest.yml（electron-updater 元数据；sha512 为原始摘要的 base64）
          $hex = (Get-FileHash $setup -Algorithm SHA512).Hash
          $raw = New-Object byte[] ($hex.Length / 2)
          for ($i = 0; $i -lt $raw.Length; $i++) { $raw[$i] = [Convert]::ToByte($hex.Substring($i * 2, 2), 16) }
          $sha512 = [Convert]::ToBase64String($raw)
          $size = (Get-Item $setup).Length
          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $yml = @"
          version: $v
          path: $setup
          sha512: $sha512
          releaseDate: '$releaseDate'
          files:
            - url: $setup
              sha512: $sha512
              size: $size
          "@
          Set-Content -Path 'latest.yml' -Value $yml -Encoding utf8
          Get-ChildItem OmniGet_*, latest.yml

      - name: Rename artifacts (macos)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          cd release
          for f in *-x64.dmg;        do [ -e "$f" ] && mv "$f" "OmniGet_${V}_x64.dmg"; done
          for f in *-arm64.dmg;      do [ -e "$f" ] && mv "$f" "OmniGet_${V}_aarch64.dmg"; done
          for f in *-universal.dmg;  do [ -e "$f" ] && mv "$f" "OmniGet_${V}_universal.dmg"; done
          ls OmniGet_*.dmg || true
          # 兜底告警：electron-builder 产物命名若不带 -arch 后缀，改名会落空——
          # 未规范命名的残留 dmg 显式告警而非静默上传
          shopt -s nullglob
          for f in *.dmg; do
            case "$f" in OmniGet_*) ;; *) echo "::warning::未识别命名口径的 dmg 产物：$f";; esac
          done

      - name: Rename artifacts (linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          cd release
          for f in *-x86_64.AppImage; do [ -e "$f" ] && mv "$f" "OmniGet_${V}_x64.AppImage"; done
          for f in *-amd64.deb;       do [ -e "$f" ] && mv "$f" "OmniGet_${V}_x64.deb"; done
          ls OmniGet_* || true

      # ── 一期（backlog §一 #3）：发布侧引擎资产 ─────────────────────────
      # 应用内引擎按需下载（engine-fetch）的数据源：<platform>-<arch>/manifest.json
      # + 引擎文件本体（含 deno / N_m3u8DL-RE 软收集项——缺失时清单相应缺条目）
      - name: Prepare engine dist
        run: node scripts/gen-engine-manifest.mjs

      - name: Upload engine dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniget-engine-dist-${{ matrix.platform }}
          path: release/engine-dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniget-${{ matrix.platform }}
          path: |
            release/OmniGet*.exe
            release/OmniGet*.exe.blockmap
            release/latest.yml
            release/OmniGet*.zip
            release/OmniGet*.msi
            release/OmniGet*.dmg
            release/OmniGet*.AppImage
            release/OmniGet*.deb
          if-no-files-found: warn
          retention-days: 14

  # ── 一期（backlog §一 #3）：tag 推送自动创建 GitHub Release ──────────
  # 挂齐三平台安装包 + latest.yml/blockmap（electron-updater 自动更新元数据）
  # + <platform>-<arch> 引擎资产（按需下载/热更通道）。Release 资产是平铺
  # 命名空间，引擎资产按 <platform>-<arch>-<文件名> 扁平化上传
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: omniget-*
          path: dist

      - name: Flatten release assets
        shell: bash
        run: |
          mkdir rel
          for d in dist/omniget-win dist/omniget-mac dist/omniget-linux; do
            [ -d "$d" ] && cp "$d"/OmniGet* "$d"/latest.yml rel/ 2>/dev/null || true
          done
          # 引擎资产按 manifest.json 所在目录定位（与 upload-artifact 的目录层级无关）
          for d in $(find dist -type f -name manifest.json | xargs -n1 dirname); do
            key=$(basename "$d")
            cp "$d/manifest.json" "rel/${key}-manifest.json"
            for f in "$d"/*; do
              b=$(basename "$f")
              [ "$b" = manifest.json ] && continue
              cp "$f" "rel/${key}-${b}"
            done
          done
          ls -la rel

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "OmniGet ${{ github.ref_name }}" \
            --generate-notes \
            rel/* \
          || gh release upload "${{ github.ref_name }}" rel/* --clobber
