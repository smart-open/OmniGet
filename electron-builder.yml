appId: com.omniget.app
productName: OmniGet
# R6：安装包瘦身——app.asar 与 NSIS 压缩档用最高压缩级别（构建耗时略增）
compression: maximum
directories:
  output: release
files:
  - out/**
# 回归审查：electron-builder 平台段的 extraResources 对顶层同名键是「整键覆盖」
# 而非合并——顶层 icon.png 项在三个平台都会被覆盖丢弃（打包态托盘/悬浮窗/窗口
# 图标全部失效）。因此 icon.png 必须并入每个平台的 extraResources；顶层不再保留
# （第六轮审查同时移除了对不存在目录 engines/common 的引用）
protocols:
  - name: magnet
    schemes:
      - magnet
win:
  extraResources:
    # 运行时目录约定 = process.platform-arch（win32-x64），与 dev/CI 一致
    - from: resources/engines/win32-${arch}
      to: engines
      filter:
        - '**/*'
    # 统一应用图标（托盘运行时加载；平台段覆盖顶层，必须在此声明）
    - from: resources/icon.png
      to: icon.png
  # CI 产物重命名为：x64-setup.exe / x64_portable.zip / x64_zh-CN.msi（见 workflows/build.yml）
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
    - target: msi
      arch:
        - x64
  # 本机无符号链接特权时 winCodeSign 缓存解压失败（darwin dylib 软链）。
  # 开启 Windows「开发者模式」后可移除此开关，恢复 exe 图标/版本戳印。
  # 一期（backlog §一 #2）：CI 已用 CLI 覆盖 -c.win.signAndEditExecutable=true；
  # EV 证书经 CI secrets（WINDOWS_CSC_LINK / WINDOWS_CSC_KEY_PASSWORD）接入
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # NSIS 协议注册（magnet:）由 electron-builder 依据顶层 protocols 生成
msi:
  oneClick: false
  perMachine: false
  # MSI UI 语言跟随系统 locale；中文系统即显示 zh-CN 界面（WiX 由 electron-builder 自动下载）
mac:
  extraResources:
    # 运行时目录约定 = darwin-arch（darwin-arm64 / darwin-x64）
    - from: resources/engines/darwin-${arch}
      to: engines
      filter:
        - '**/*'
    # 统一应用图标（托盘运行时加载；平台段覆盖顶层，必须在此声明）
    - from: resources/icon.png
      to: icon.png
  # 两种 dmg：Intel(x64) / Apple Silicon(arm64)。universal 无法捆绑平台化 sidecar，不产出
  # 第十一轮审查 P2：electron-updater 的 MacUpdater 要求发布物含 zip target
  #（latest-mac.yml 需 zip 条目）——dmg-only 发布使 macOS 自动更新链路永不可达
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  darkModeSupport: true
  # 签名/公证（遗留清单 #2）：接入 Apple 开发者证书后在 CI 环境注入以下变量并取消注释，
  # 缺证书时保持注释（notarize: true 且无凭证会导致构建失败）：
  # identity: null            # 使用 CI 钥匙串中的 "Developer ID Application" 证书
  # notarize: true            # 依赖 env: APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
  # hardenedRuntime: true
  # entitlements: build/entitlements.mac.plist
  extendInfo:
    CFBundleURLTypes:
      - CFBundleURLName: magnet
        CFBundleURLSchemes:
          - magnet
linux:
  extraResources:
    # 运行时目录约定 = linux-arch（linux-x64）
    - from: resources/engines/linux-${arch}
      to: engines
      filter:
        - '**/*'
    # 统一应用图标（托盘运行时加载；平台段覆盖顶层，必须在此声明）
    - from: resources/icon.png
      to: icon.png
  target:
    - AppImage
    - deb
  category: Network;FileTransfer
  mimeTypes:
    - x-scheme-handler/magnet
# 自动更新通道（electron-updater：win 仅 NSIS 安装形态 / mac dmg+zip；linux 不支持在线更新属上游限制）
publish:
  provider: github
